[window]
padding = { x = 7, y = 5 }
dynamic_padding = true
dynamic_title = false

[font]
normal = { family = "Iosevka Term", style = "Regular" }
bold = { family = "Iosevka Term", style = "Bold" }
italic = { family = "Iosevka Term", style = "Italic" }
bold_italic = { family = "Iosevka Term", style = "Bold Italic" }
size = 14

[colors.primary]
background = "#000000"
foreground = "#c1c9d2"

[colors.cursor]
text = "#000000"
cursor = "#c1c9d2"

[colors.selection]
text = "#f8f8f2"
background = "#44475a"

[colors.normal]
black = "#000000"
red = "#ff5555"
green = "#1ea672"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"

[colors.bright]
black = "#6272a4"
red = "#ff6e6e"
green = "#85d996"
yellow = "#ffffa5"
blue = "#d6acff"
magenta = "#ff92df"
cyan = "#a4ffff"
white = "#ffffff"

[cursor]
style = { shape = "Block", blinking = "Off" }

[selection]
save_to_clipboard = true
